<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Form Validation Test</title><script defer="defer" src="main.js"></script></head><body><form novalidate><div><label for="email">Email:</label> <input id="email" name="email"/></div><div><label for="country">Country:</label> <select id="country" name="country"><option value="" selected="selected" disabled="disabled" hidden>Please choose a country.</option><option value="au">Australia</option><option value="nz">New Zealand</option><option value="uk">United Kingdom</option><option value="us">United States</option></select></div><div><label for="post-code">Post Code:</label> <input id="post-code" name="post-code"/></div><div><label for="password">Password:</label> <input id="password" name="password" type="password"/></div><div><label for="password-confirm">Confirm Password:</label> <input id="password-confirm" name="password-confirm" type="password"/></div><button>Submit</button></form></body></html>
